services:
  api-tests:
    image: api-automation

    environment:
      TEST_ENV: ${TEST_ENV:-qa}
      BASE_URL: ${BASE_URL}
      BOOKER_USERNAME: ${BOOKER_USERNAME}
      BOOKER_PASSWORD: ${BOOKER_PASSWORD}
      REPORT_FILE: ${REPORT_FILE:-report.json}
      TEST_ARGS: ${TEST_ARGS:-}

    volumes:
      - ./allure-results:/app/allure-results
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - ./reports:/app/reports

    # IMPORTANT: use $$ for variables that must be read INSIDE the container.
    # A single $ is replaced by docker compose on the host at parse time. TEST_ARGS
    # is only passed to the container with `-e`, so on the host it is empty and
    # the --grep filter was silently dropped (every job ran the full suite).
    command:
      - sh
      - -c
      - |
        echo "================================="
        echo "Running $$TEST_ENV Tests"
        echo "Report File: $$REPORT_FILE"
        echo "Test Args: $$TEST_ARGS"
        echo "================================="

        npx playwright test $$TEST_ARGS
        status=$$?

        echo ""
        echo "Generated Allure Results"
        ls -la /app/allure-results || true

        echo ""
        echo "Generated Playwright Report"
        ls -la /app/playwright-report || true

        echo ""
        echo "Generated Reports Folder"
        ls -la /app/reports || true

        # Keep the real test exit code so failed tests fail the job
        exit $$status
