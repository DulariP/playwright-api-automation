services:
  api-tests:
    image: api-automation

    environment:
      TEST_ENV: ${TEST_ENV:-qa}
      BASE_URL: ${BASE_URL}
      BOOKER_USERNAME: ${BOOKER_USERNAME}
      BOOKER_PASSWORD: ${BOOKER_PASSWORD}

    volumes:
      - ./allure-results:/app/allure-results
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results

    command: >
      sh -c "
      echo '====================================';
      echo 'Running tests for environment:' $TEST_ENV;
      echo '====================================';

      npx playwright test;

      echo '';
      echo 'Generated Allure Results';
      ls -la /app/allure-results || true;

      echo '';
      echo 'Generated Playwright Report';
      ls -la /app/playwright-report || true;
      "
