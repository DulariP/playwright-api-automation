name: Docker Playwright API Tests

on:
  push:
    branches:
      - main
      - feature/ci-cd-clean

  pull_request:
    branches:
      - main

  schedule:
    # 5:00 PM Sri Lanka time (UTC+5:30) = 11:30 UTC
    - cron: "30 11 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  ########################################################
  # SMOKE TESTS
  ########################################################
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-automation .

      - name: Run Smoke Tests
        env:
          TEST_ENV: qa
          REPORT_FILE: smoke-report.json
          BASE_URL: ${{ secrets.BASE_URL }}
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          echo "================================="
          echo "Running Smoke Tests"
          echo "Environment: $TEST_ENV"
          echo "Report: $REPORT_FILE"
          echo "================================="

          docker compose run \
            -e TEST_ENV="$TEST_ENV" \
            -e REPORT_FILE="$REPORT_FILE" \
            -e BASE_URL="$BASE_URL" \
            -e BOOKER_USERNAME="$BOOKER_USERNAME" \
            -e BOOKER_PASSWORD="$BOOKER_PASSWORD" \
            -e TEST_ARGS="--grep @smoke" \
            api-tests

      - name: Upload Smoke Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            reports/smoke-report.json
            allure-results
          if-no-files-found: warn
          retention-days: 30

  ########################################################
  # REGRESSION TESTS
  ########################################################
  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t api-automation .

      - name: Run Regression Tests
        env:
          TEST_ENV: qa
          REPORT_FILE: regression-report.json
          BASE_URL: ${{ secrets.BASE_URL }}
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          echo "================================="
          echo "Running Regression Tests"
          echo "Environment: $TEST_ENV"
          echo "Report: $REPORT_FILE"
          echo "================================="

          docker compose run \
            -e TEST_ENV="$TEST_ENV" \
            -e REPORT_FILE="$REPORT_FILE" \
            -e BASE_URL="$BASE_URL" \
            -e BOOKER_USERNAME="$BOOKER_USERNAME" \
            -e BOOKER_PASSWORD="$BOOKER_PASSWORD" \
            -e TEST_ARGS="--grep @regression" \
            api-tests

      - name: Upload Regression Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            reports/regression-report.json
            allure-results
          if-no-files-found: warn
          retention-days: 30

  ########################################################
  # QA / STAGING TESTS (full suite)
  ########################################################
  api-tests:
    name: API Tests - ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - qa
          - staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t api-automation .

      - name: Run API Tests
        env:
          TEST_ENV: ${{ matrix.environment }}
          REPORT_FILE: ${{ matrix.environment }}-report.json
          # Staging uses STAGING_BASE_URL if you define that secret,
          # otherwise it falls back to BASE_URL (same behaviour as before).
          BASE_URL: ${{ matrix.environment == 'staging' && secrets.STAGING_BASE_URL || secrets.BASE_URL }}
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          echo "================================="
          echo "Running API Tests"
          echo "Environment: $TEST_ENV"
          echo "Report: $REPORT_FILE"
          echo "================================="

          docker compose run \
            -e TEST_ENV="$TEST_ENV" \
            -e REPORT_FILE="$REPORT_FILE" \
            -e BASE_URL="$BASE_URL" \
            -e BOOKER_USERNAME="$BOOKER_USERNAME" \
            -e BOOKER_PASSWORD="$BOOKER_PASSWORD" \
            api-tests

      - name: List generated files
        if: always()
        run: |
          ls -la reports || true
          ls -la allure-results | head -20 || true

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.environment }}-results
          path: |
            reports/${{ matrix.environment }}-report.json
            allure-results
          if-no-files-found: warn
          retention-days: 30

  ########################################################
  # PUBLISH REPORTS
  ########################################################
  publish-report:
    name: Generate Reports & Publish
    needs:
      - smoke-tests
      - regression-tests
      - api-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Download artifacts ----------
      # continue-on-error: if one job crashed before uploading anything,
      # the remaining reports are still published (the email flags the missing one).

      - name: Download Smoke Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-results
          path: reports/smoke

      - name: Download Regression Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: regression-results
          path: reports/regression

      - name: Download QA Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-results
          path: reports/qa

      - name: Download Staging Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: staging-results
          path: reports/staging

      # ---------- Collect files ----------

      - name: Prepare Report Directories
        run: |
          mkdir -p reports/allure-results
          mkdir -p reports/json

      # NOTE: `find -exec` does not run a shell, so a `*` glob is never expanded.
      # Using `{}/.` copies the directory contents without needing a glob.
      - name: Collect Allure Results
        id: allure
        run: |
          # Only qa + staging feed the Allure report. smoke/regression run the same
          # tests again, which would show up as duplicate "retries" in Allure.
          for name in qa staging; do
            if [ -d "reports/$name" ]; then
              find "reports/$name" -type d -name "allure-results" \
                -exec cp -r {}/. reports/allure-results/ \;
            else
              echo "WARNING: reports/$name not found"
            fi
          done

          count=$(find reports/allure-results -type f | wc -l)
          echo "Allure files collected: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # Only real Playwright reports (*-report.json), never Allure JSON files.
      - name: Collect JSON Reports
        run: |
          find reports -type f -name "*-report.json" \
            -not -path "reports/json/*" \
            -not -path "*/allure-results/*" \
            -exec cp {} reports/json/ \;

          echo "Collected JSON reports:"
          ls -la reports/json

      # ---------- Generate summary / email / PDF ----------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Reports
        run: npm run generate-report

      # ---------- Allure ----------

      - name: Install Allure Commandline
        if: steps.allure.outputs.count != '0'
        run: npm install -g allure-commandline

      - name: Generate Allure HTML Report
        if: steps.allure.outputs.count != '0'
        run: |
          allure generate reports/allure-results \
            -o allure-report \
            --clean

      - name: Upload Generated Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-api-reports
          path: |
            reports
            allure-report
          if-no-files-found: warn
          retention-days: 30

      # Deploy only from main, and only if Allure actually has results,
      # so a bad run never overwrites a good published report.
      - name: Deploy Allure Report
        if: github.ref == 'refs/heads/main' && steps.allure.outputs.count != '0'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

      # ---------- Email ----------

      - name: Create Email Subject
        id: subject
        if: ${{ !cancelled() && hashFiles('reports/email.txt') != '' }}
        run: echo "subject=$(cat reports/email-subject.txt)" >> "$GITHUB_OUTPUT"

      - name: Send Email Notification
        if: ${{ !cancelled() && hashFiles('reports/email.txt') != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.subject.outputs.subject }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: file://reports/email.txt
          attachments: |
            reports/API_Test_Report.pdf