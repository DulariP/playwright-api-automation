name: Docker Playwright API Tests

on:
  push:
    branches:
      - main
      - feature/ci-cd-clean

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - qa
          - staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-automation .

      - name: Run Playwright Tests
        env:
          TEST_ENV: ${{ matrix.environment }}
          BASE_URL: ${{ secrets.BASE_URL }}
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

        run: |
          echo "Running tests for $TEST_ENV"
          docker compose up --abort-on-container-exit --force-recreate

      - name: Verify Allure Results
        if: always()
        run: |
          echo "Listing allure-results..."
          ls -la
          ls -la allure-results || true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.environment }}
          path: allure-results
          retention-days: 30

  publish-report:
    needs: api-tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      ###################################################
      # Download QA Results
      ###################################################

      - name: Download QA Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-qa
          path: qa-results

      ###################################################
      # Download Staging Results
      ###################################################

      - name: Download Staging Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-staging
          path: staging-results

      ###################################################
      # Install Java
      ###################################################

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      ###################################################
      # Install Allure
      ###################################################

      - name: Install Allure
        run: npm install -g allure-commandline

      ###################################################
      # Generate QA Report
      ###################################################

      - name: Generate QA Report
        run: |
          allure generate qa-results --clean -o qa

      ###################################################
      # Generate Staging Report
      ###################################################

      - name: Generate Staging Report
        run: |
          allure generate staging-results --clean -o staging

      ###################################################
      # Prepare GitHub Pages
      ###################################################

      - name: Prepare Pages
        run: |
          mkdir public
          cp -R qa public/
          cp -R staging public/

      ###################################################
      # Create Landing Page
      ###################################################

      - name: Create Landing Page
        run: |
          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html>

          <head>
            <title>API Automation Reports</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
              }

              h1 {
                margin-bottom: 30px;
              }

              li {
                margin: 15px;
              }

              a {
                font-size: 20px;
              }
            </style>
          </head>


          <body>

            <h1>
              Playwright API Automation Reports
            </h1>


            <ul>

              <li>
                <a href="./qa/">
                  QA Report
                </a>
              </li>


              <li>
                <a href="./staging/">
                  Staging Report
                </a>
              </li>

            </ul>


          </body>

          </html>
          EOF

      ###################################################
      # Verify Pages Structure
      ###################################################

      - name: Verify Pages Content
        run: |
          echo "Generated GitHub Pages files:"
          find public -maxdepth 2 -type f

      ###################################################
      # Upload HTML Report
      ###################################################

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-html
          path: public

      ###################################################
      # Deploy to GitHub Pages
      ###################################################

      - name: Deploy Reports
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          force_orphan: true
