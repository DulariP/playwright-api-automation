name: Docker Playwright API Tests

on:
  push:
    branches:
      - main
      - feature/ci-cd-clean

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - qa
          - staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-automation .

      - name: Run Docker tests
        env:
          TEST_ENV: ${{ matrix.environment }}
          BASE_URL: ${{ secrets.BASE_URL }}
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

        run: |
          echo "Running environment: $TEST_ENV"
          docker compose up --abort-on-container-exit --force-recreate

      - name: Check Allure Results
        if: always()
        run: |
          echo "Environment: ${{ matrix.environment }}"
          ls -la allure-results || true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.environment }}
          path: allure-results/
          retention-days: 30

  generate-allure-report:
    needs: api-tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download QA Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-qa
          path: allure-results

      - name: Download Staging Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-staging
          path: allure-results

      - name: Check Merged Results
        run: |
          echo "Merged Allure Results:"
          ls -la allure-results

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Generate Allure HTML Report
        run: npm run allure:generate

      - name: Verify Allure Report
        run: |
          echo "Allure HTML:"
          ls -la allure-report

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Final Reports
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: |
            allure-results/
            allure-report/
          retention-days: 30
