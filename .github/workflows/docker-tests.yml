name: Docker Playwright API Tests

on:
  push:
    branches:
      - main
      - feature/ci-cd-clean

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

  api-tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - qa
          - staging

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-automation .

      - name: Run Docker Tests
        env:
          TEST_ENV: ${{ matrix.environment }}
          BASE_URL: ${{ secrets.BASE_URL }}
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          echo "Running $TEST_ENV"
          docker compose up --abort-on-container-exit --force-recreate

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.environment }}
          path: allure-results
          retention-days: 30

  generate-allure-report:

    needs: api-tests

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Download QA Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-qa
          path: qa-results

      - name: Download Staging Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-staging
          path: staging-results

      - name: Merge Results
        run: |
          mkdir allure-results
          cp -r qa-results/* allure-results/
          cp -r staging-results/* allure-results/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: allure-report

      - name: Deploy Report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: true