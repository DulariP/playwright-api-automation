name: Docker Playwright API Tests

on:
  push:
    branches:
      - main
      - feature/ci-cd-clean

  pull_request:
    branches:
      - main

  schedule:
    - cron: "30 11 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  ########################################################
  # SMOKE TESTS
  ########################################################

  smoke-tests:
    name: Smoke Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Build Docker image

        run: docker build -t api-automation .

      - name: Run Smoke Tests

        env:
          TEST_ENV: qa

          REPORT_FILE: smoke-report.json

          BASE_URL: ${{ secrets.BASE_URL }}

          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}

          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

        run: |


          echo "================================="
          echo "Running Smoke Tests"
          echo "Environment: $TEST_ENV"
          echo "Report: $REPORT_FILE"
          echo "================================="

          docker compose run \
          -e TEST_ENV=$TEST_ENV \
          -e REPORT_FILE=$REPORT_FILE \
          -e BASE_URL=$BASE_URL \
          -e BOOKER_USERNAME=$BOOKER_USERNAME \
          -e BOOKER_PASSWORD=$BOOKER_PASSWORD \
          -e TEST_ARGS="--grep @smoke" \
          api-tests

      - name: Upload Smoke Results

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: smoke-results

          path: |


            allure-results

            reports/smoke-report.json

          retention-days: 30

  ########################################################
  # REGRESSION TESTS
  ########################################################

  regression-tests:
    name: Regression Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Build Docker image

        run: docker build --no-cache -t api-automation .

      - name: Run Regression Tests

        env:
          TEST_ENV: qa

          REPORT_FILE: regression-report.json

          BASE_URL: ${{ secrets.BASE_URL }}

          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}

          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

        run: |


          echo "================================="
          echo "Running Regression Tests"
          echo "Environment: $TEST_ENV"
          echo "Report: $REPORT_FILE"
          echo "================================="

          docker compose run \
          -e TEST_ENV=$TEST_ENV \
          -e REPORT_FILE=$REPORT_FILE \
          -e BASE_URL=$BASE_URL \
          -e BOOKER_USERNAME=$BOOKER_USERNAME \
          -e BOOKER_PASSWORD=$BOOKER_PASSWORD \
          -e TEST_ARGS="--grep @regression" \
          api-tests

      - name: Upload Regression Results

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: regression-results

          path: |


            allure-results

            reports/regression-report.json

          retention-days: 30

  ########################################################
  # QA / STAGING TESTS
  ########################################################

  api-tests:
    name: API Tests - ${{ matrix.environment }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        environment:
          - qa

          - staging

    steps:
      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Build Docker image

        run: docker build --no-cache -t api-automation .

      - name: Run API Tests

        env:
          TEST_ENV: ${{ matrix.environment }}

          REPORT_FILE: ${{ matrix.environment }}-report.json

          BASE_URL: ${{ secrets.BASE_URL }}

          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}

          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

        run: |

          echo "================================="
          echo "Running API Tests"
          echo "Environment: $TEST_ENV"
          echo "Report: $REPORT_FILE"
          echo "================================="

          docker compose run \
           -e TEST_ENV=$TEST_ENV \
           -e REPORT_FILE=$REPORT_FILE \
           -e BASE_URL=$BASE_URL \
           -e BOOKER_USERNAME=$BOOKER_USERNAME \
           -e BOOKER_PASSWORD=$BOOKER_PASSWORD \
           api-tests

      - name: Upload API Test Results

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: ${{ matrix.environment }}-results

          path: |

            allure-results

            reports/${{ matrix.environment }}-report.json

          if-no-files-found: warn

          retention-days: 30

  ########################################################
  # PUBLISH REPORTS
  ########################################################

  publish-report:
    name: Generate Reports & Publish

    needs:
      - smoke-tests

      - regression-tests

      - api-tests

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository

        uses: actions/checkout@v4

      ########################################################
      # DOWNLOAD ARTIFACTS
      ########################################################

      - name: Download Smoke Results

        uses: actions/download-artifact@v4

        with:
          name: smoke-results

          path: reports/smoke

      - name: Download Regression Results

        uses: actions/download-artifact@v4

        with:
          name: regression-results

          path: reports/regression

      - name: Download QA Results

        uses: actions/download-artifact@v4

        with:
          name: qa-results

          path: reports/qa

      - name: Download Staging Results

        uses: actions/download-artifact@v4

        with:
          name: staging-results

          path: reports/staging

          ########################################################
      # PREPARE REPORT DIRECTORIES
      ########################################################

      - name: Prepare Report Directory

        run: |


          mkdir -p reports/allure-results

          mkdir -p reports/json

          mkdir -p reports/output

      ########################################################
      # COLLECT ALLURE RESULTS
      ########################################################

      - name: Collect Allure Results

        run: |


          find reports -type d -name "allure-results" \
          -exec cp -r {}/* reports/allure-results/ \;

      ########################################################
      # COLLECT JSON REPORTS
      ########################################################

      - name: Collect JSON Reports

        run: |


          cp reports/smoke/smoke-report.json reports/json/ || true

          cp reports/regression/regression-report.json reports/json/ || true

          cp reports/qa/qa-report.json reports/json/ || true

          cp reports/staging/staging-report.json reports/json/ || true

      ########################################################
      # INSTALL NODE DEPENDENCIES
      ########################################################

      - name: Install Dependencies

        run: npm ci

      ########################################################
      # GENERATE SUMMARY REPORT
      ########################################################

      - name: Generate Test Summary

        run: |


          npm run generate-report
      - name: Debug Report Files

        run: |

          echo "=============================="

          echo "All JSON files"

          find reports -name "*.json" -type f

          echo "=============================="

          echo "JSON content preview"

          for file in $(find reports -name "*.json" -type f)
          do
            echo "-----------"
            echo $file
            head -c 500 $file
            echo
          done

      ########################################################
      # GENERATE REPORTS
      ########################################################

      - name: Generate Reports

        run: |

          npm run generate-report

      ########################################################
      # INSTALL ALLURE

      - name: Install Allure Commandline

        run: |


          npm install -g allure-commandline

      ########################################################
      # GENERATE ALLURE REPORT
      ########################################################

      - name: Generate Allure HTML Report

        run: |


          allure generate reports/allure-results \
          -o allure-report \
          --clean

      ########################################################
      # UPLOAD ALL REPORTS
      ########################################################

      - name: Upload Generated Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: final-api-reports

          path: |


            reports

            allure-report

          retention-days: 30

      ########################################################
      # DEPLOY ALLURE TO GITHUB PAGES
      ########################################################

      - name: Deploy Allure Report

        uses: peaceiris/actions-gh-pages@v4

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          publish_dir: ./allure-report

          publish_branch: gh-pages

      ########################################################
      # CREATE EMAIL SUBJECT
      ########################################################

      - name: Create Email Subject

        id: subject

        run: |

          TOTAL=$(node -e "const s=require('./reports/summary.json'); console.log(s.total)")

          FAILED=$(node -e "const s=require('./reports/summary.json'); console.log(s.failed)")


          if [ "$FAILED" -eq "0" ]

          then

            echo "subject=✅ API Automation Pipeline PASSED | $TOTAL Tests Passed" >> $GITHUB_OUTPUT


          else

            echo "subject=❌ API Automation Pipeline FAILED | $FAILED Tests Failed" >> $GITHUB_OUTPUT


          fi

      ########################################################
      # SEND EMAIL
      ########################################################

      - name: Send Email Notification

        uses: dawidd6/action-send-mail@v3

        with:
          server_address: smtp.gmail.com

          server_port: 465

          username: ${{ secrets.EMAIL_USERNAME }}

          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: ${{ steps.subject.outputs.subject }}

          to: ${{ secrets.EMAIL_TO }}

          from: ${{ secrets.EMAIL_USERNAME }}

          body: file://reports/email.txt

          attachments: |
            reports/API_Test_Report.pdf
