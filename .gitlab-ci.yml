stages:
  - test

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "feature/ci-cd-clean"

api_tests_qa:
  stage: test

  image: mcr.microsoft.com/playwright:v1.55.0-jammy

  cache:
    key: npm
    paths:
      - .npm/

  before_script:
    - npm ci --cache .npm --prefer-offline

  script:
    - npm run test:qa

  artifacts:
    when: always

    paths:
      - playwright-report/
      - test-results/

    expire_in: 7 days
